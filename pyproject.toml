[project]
name = "dzirkva"
version = "0.1.0"
description = "Georgian-only search engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "trafilatura>=2.2.0",
]

[project.scripts]
dzirkva = "dzirkva:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
