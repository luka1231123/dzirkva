[project]
name = "dzirkva"
version = "0.1.0"
description = "Georgian-only search engine"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.8",
    "trafilatura>=2.2.0",
]

[project.scripts]
dzirkva = "dzirkva:main"
dzirkva-mcp = "dzirkva.mcp:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.28,<2",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

# Linux server has no GPU: CPU-only torch, without the CUDA libraries
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
