# What a query wants: its words → the sites made for that need.
# ka: the name the page shows. words: dictionary forms; any form in the query matches (ამინდი matches ამინდს,
# ამინდის); a_b is a phrase (ახალი_ამბები).
# sites: hosts, best first; a host covers its subdomains. trusted: a category of config/sources.yaml (more sites).
# The intent with the most matching query words wins; a word in several intents counts for each in part.
# Ties: the first in this file, so narrow intents come before broad ones (crypto before currency). Its sites get one
# site: query in round 1 and a ranking bonus (search.INTENT_BONUS). No intent: category "reference".
# encyclopedia: false = the query wants a service (a pharmacy, a flat, a ticket), not an article: Wikipedia pages
# that only our local indexes found get the lowest weight (search.LOCAL_FLOOR), however close their title.

