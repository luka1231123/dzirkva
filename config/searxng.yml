# Paused: dzirkva calls SearXNG only with SEARXNG=1 in .env (src/dzirkva/engines.py).
# Engines tested with Georgian queries (2026-09):
#   google  - REMOVED 2026-10: CAPTCHA after fast bursts on the Mac, HTTP 403 on every query from the server
#   yandex  - good Georgian index
#   yahoo   - Bing's index, handles Georgian queries
#   bing    - REMOVED: ignores Georgian queries, returns random English pages
#   brave   - REMOVED: scraper gets rate-limited; the official Brave API is used instead
#   duckduckgo, qwant - REMOVED: CAPTCHA
use_default_settings:
  engines:
    keep_only: [yandex, yahoo]
general:
  instance_name: dzirkva
search:
  formats: [html, json]
server:
  bind_address: 127.0.0.1
  port: 8888
  limiter: false
  image_proxy: false
outgoing:
  request_timeout: 6.0
engines:  # yandex is disabled in SearXNG's defaults
  - name: yandex
    disabled: false
