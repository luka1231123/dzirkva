# Trusted Georgian sources: where Georgian knowledge lives.  domain: tier
# tier 1 = primary, official, scholarly, reference (the source of the fact)
# tier 2 = professional journalism, analysis, cultural institutions, strong communities
# tier 3 = useful but lower trust: user listings, weekly tabloid-style press
# A domain also covers its subdomains (nplg.gov.ge covers dspace.nplg.gov.ge).
# Chosen for information quality. scripts/check_sources.py only checks online + Georgian text.

reference:            # encyclopedias, dictionaries, libraries, corpora
  ka.wikipedia.org: 1
  ka.wikisource.org: 1        # Georgian classic texts
  ka.wiktionary.org: 2
  iverieli.nplg.gov.ge: 1     # National Parliamentary Library digital library (books, press archive)
  nplg.gov.ge: 1              # National Parliamentary Library (catalogues, dictionaries, encyclopedias)
  ena.ge: 1                   # Georgian language portal, explanatory dictionary
  gnc.gov.ge: 1               # Georgian National Corpus
  manuscript.ge: 1            # National Centre of Manuscripts
  lib.ge: 2                   # Georgian electronic library (literature)

science:              # research institutions and universities
  science.org.ge: 1           # Georgian National Academy of Sciences
  rustaveli.org.ge: 1         # Shota Rustaveli National Science Foundation
  tsu.ge: 1
  iliauni.edu.ge: 1
  gtu.ge: 1
  tsmu.edu: 1
  freeuni.edu.ge: 1
  sangu.edu.ge: 2
  btu.edu.ge: 2
  ibsu.edu.ge: 2

history:              # archives, memory, heritage
  archive.gov.ge: 1
  sovlab.ge: 1                # Soviet Past Research Laboratory
  memkvidreoba.gov.ge: 1      # National Agency for Cultural Heritage Preservation
  heritagesites.ge: 1
  museum.ge: 1                # Georgian National Museum

religion:
  patriarchate.ge: 1
  orthodoxy.ge: 2
  orthodox.ge: 2

culture:              # literature, film, music
  arilimag.ge: 2              # literary magazine
  gnfc.ge: 1                  # Georgian National Film Center
  polyphony.ge: 1             # Traditional Polyphony research centre
  indigo.com.ge: 2            # long-form magazine
  gemrielia.ge: 2             # recipes

